# GDPR log marker stack (MAIR-290) for the BFF Elearning: the services of docker-compose-integration.yml
# (published Core API and E-learning API images, seeded database, Redis) plus the `gdpr-marker` runner of
# mairie360/CICD (tests/gdpr/marker), which plays gdpr-marker.yaml with a marker user through the BFF.
# gdpr_marker_test.sh then searches the logs of every container (the BFF, its upstream APIs, Postgres,
# Redis) for its values.
#
#   ./gdpr_marker_test.sh                    (local: builds bff-elearning:local from development.Dockerfile)
#   IMAGE_REF=<image> ./gdpr_marker_test.sh  (CI: the image promoted to staging)
#
# The session key pair and ADMIN_JWT come from stack_secrets.sh (fresh Ed25519 key pair per run, MAIR-428, MAIR-680).
#
# BFF Elearning reads the caller's profile and roles from Core API (never from BFF User, MAIR-525):
# the stack embeds Core API on top of the E-learning API.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-c5b8e22}
    container_name: bff-elearning-gdpr-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-c5b8e22}
    container_name: bff-elearning-gdpr-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: bff-elearning-gdpr-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: bff-elearning-gdpr-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-156a9b9}
    container_name: bff-elearning-gdpr-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the journey hammers it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with this run's Ed25519 key pair from
      # stack_secrets.sh; no JWT_SECRET, so no HS256 token is accepted anywhere in the stack.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-elearning-gdpr-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    # Bounded (3 minutes): an API that never answers fails the stack instead of hanging the run.
    command: >
      sh -c 'for i in $$(seq 90); do
      if curl -fsS http://core-api:3000/health >/dev/null; then echo "core-api ready"; exit 0; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api not ready after 3 minutes"; exit 1'
    networks:
      - backend

  elearning-api:
    image: ${ELEARNING_API_IMAGE:-ghcr.io/mairie360/elearning-api:dev-7f790d5}
    container_name: bff-elearning-gdpr-elearning-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the journey hammers it as one user (never 0: the API
      # refuses to start with a zero limit).
      RATE_LIMIT_PER_SECOND: "100000"
      RATE_LIMIT_BURST: "100000"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3006
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://elearning-api:3006
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
      # Scaleway Object Storage (S3), required since elearning-api 0.5.0: placeholders
      S3_BUCKET: mairie360-elearning
      S3_REGION: fr-par
      S3_ENDPOINT: https://s3.fr-par.scw.cloud
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_PRESIGN_TTL_SECS: 900
    expose:
      - "3006"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur elearning-api-ready ci-dessous.

  elearning-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-elearning-gdpr-elearning-api-ready
    depends_on:
      elearning-api:
        condition: service_started
    # Bounded (3 minutes): an API that never answers fails the stack instead of hanging the run.
    command: >
      sh -c 'for i in $$(seq 90); do
      if curl -fsS http://elearning-api:3006/health >/dev/null; then echo "elearning-api ready"; exit 0; fi;
      echo "waiting for elearning-api..."; sleep 2; done; echo "elearning-api not ready after 3 minutes"; exit 1'
    networks:
      - backend

  bff-elearning:
    image: ${IMAGE_REF:-bff-elearning:local}
    container_name: bff-elearning-gdpr-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      elearning-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4006
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      ELEARNING_API_URL: elearning-api
      ELEARNING_API_PORT: 3006
      # Verifies the session tokens before any upstream call (bffs-lib requireSession, MAIR-474).
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4006"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gdpr-marker:
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    container_name: bff-elearning-gdpr-marker
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      bff-elearning:
        condition: service_healthy
    environment:
      # Admin JWT of the run (sub=1, the seeded Admin), EdDSA, signed by stack_secrets.sh like Core.
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT is generated by stack_secrets.sh, run gdpr_marker_test.sh}
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-report:/report
    command: ["/engine/marker/run.sh"]
    networks:
      - backend
