volumes:
  redis-data:
  bff-elearning-target:

secrets:
  npmrc:
    file: ./.npmrc
  node_auth_token:
    environment: NODE_AUTH_TOKEN

networks:
  backend:
  user_backend:
    external: true
    name: ${USER_BACKEND_NETWORK:-bff_user_backend}

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 4006
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: ${SHARED_DB_HOST:-mairie360-db-bff-user}
  DB_PASSWORD: password
  DB_PORT: 5432

x-depends-on: &depends-on
  redis:
    condition: service_healthy

# x-healthcheck: &healthcheck
#   test: ["CMD", "curl", "-f", "http://localhost:4006"]
#   interval: 10s
#   timeout: 5s
#   retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "4006"
  networks:
    - backend
  # healthcheck:
  #   <<: *healthcheck

services:
  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-elearning-bff #change bff name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # core:
  #   profiles: ["legacy-api"]
