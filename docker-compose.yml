    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/health"] # <--- Doit être 3000
    #   interval: 5s
    #   timeout: 2s
    #   retries: 3
    #   start_period: 10s
      
  elearning-api:
    container_name: elearning-api-bff-elearning-developpement
    image: ghcr.io/mairie360/elearning-api:dev-1054189
    ports:
      - "3006:3006"
    networks:
      - backend
      - user_backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      HOST: "0.0.0.0"
      PORT: 3006
      REDIS_URL: redis://redis:6379
      DB_TYPE: postgres
      DB_NAME: mairie_360_database
      DB_USER: postgres
      DB_HOST: ${SHARED_DB_HOST:-mairie360-db-bff-user}
      DB_PASSWORD: password
      DB_PORT: 5432
      PUBLIC_URL: http://elearning.development.mairie360.fr
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    depends_on:
      redis:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3006/health"] # <--- Doit être 3006
    #   interval: 5s
    #   timeout: 2s
    #   retries: 3
    #   start_period: 10s
  
  #add other apis if needed

  bff-elearning:
    container_name: bff-elearning-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
      secrets:
        - npmrc
        - node_auth_token
    # Mode synchronisation en temps réel (Docker Compose V2)
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
    ports:
      - "4006:4006"
    networks:
      - backend
      - user_backend
    environment:
      <<: *common-env
      # IMPORTANT : On utilise le nom du service Docker pour communiquer
      CORE_API_URL: "core-bff-user-developpement"
      CORE_API_PORT: 3000
      ELEARNING_API_URL: "elearning-api"
      ELEARNING_API_PORT: 3006
      USER_BFF_URL: "http://bff-user-developpement:4000"
    volumes:
      - /app/node_modules # Isolation des modules pour éviter les conflits OS (Mac/Windows vs Linux)
    # depends_on:
      # core:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 10s
      timeout: 5s
      retries: 3

