# Integration test stack of the BFF Elearning (MAIR-262): the same upstream services as the ZAP / k6
# stacks (published Core API and E-learning API images, seeded database) plus a `newman` runner that
# replays the committed Postman collection (tests/postman/) against the BFF over the compose network.
#
#   ./integration_test.sh                   (local: builds bff-elearning:local from development.Dockerfile)
#   IMAGE_REF=<image> ./integration_test.sh (CI: the dev-<sha> image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by IMAGE_REF, the one
# promote-staging tests and then promotes by digest. `--bail` stops at the first failing request;
# the exit code of the newman service is what integration_test.sh returns.
#
# BFF Elearning reads the caller's profile and roles from Core API (never from BFF User, MAIR-525):
# the stack embeds Core API on top of the E-learning API.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.3.0}
    container_name: bff-elearning-int-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.3.0}
    container_name: bff-elearning-int-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-elearning-int-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-elearning-int-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.2.0}
    container_name: bff-elearning-int-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the collection hammers it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-elearning-int-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  elearning-api:
    image: ${ELEARNING_API_IMAGE:-ghcr.io/mairie360/elearning-api:1.2.0}
    container_name: bff-elearning-int-elearning-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the collection hammers it as one user (never 0: the API
      # refuses to start with a zero limit).
      RATE_LIMIT_PER_SECOND: "100000"
      RATE_LIMIT_BURST: "100000"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3006
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://elearning-api:3006
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
      # Scaleway Object Storage (S3), required since elearning-api 0.5.0: placeholders
      S3_BUCKET: mairie360-elearning
      S3_REGION: fr-par
      S3_ENDPOINT: https://s3.fr-par.scw.cloud
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_PRESIGN_TTL_SECS: 900
    expose:
      - "3006"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur elearning-api-ready ci-dessous.

  elearning-api-ready:
    image: curlimages/curl:latest
    container_name: bff-elearning-int-elearning-api-ready
    depends_on:
      elearning-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://elearning-api:3006/health >/dev/null; do
      echo "waiting for elearning-api..."; sleep 2; done; echo "elearning-api ready"'
    networks:
      - backend

  bff-elearning:
    image: ${IMAGE_REF:-bff-elearning:local}
    container_name: bff-elearning-int-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      elearning-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4006
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      ELEARNING_API_URL: elearning-api
      ELEARNING_API_PORT: 3006
      # Verifies the session tokens before any upstream call (bffs-lib requireSession, MAIR-474).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4006"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Replays tests/postman/collection.json against the `bff-elearning` service. `baseUrl` and the JWT_SECRET of
  # the run are injected here so the committed environment stays usable from a host shell. The reports
  # (junit) land in ./newman-reports (gitignored), read by the CI job summary.
  newman:
    image: postman/newman:6.1.3-alpine
    container_name: bff-elearning-int-newman
    depends_on:
      bff-elearning:
        condition: service_healthy
    volumes:
      - ./tests/postman:/etc/newman:ro
      - ./newman-reports:/reports
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://bff-elearning:4006
      --env-var jwt_secret=${JWT_SECRET}
      --bail
      --reporters cli,junit
      --reporter-junit-export /reports/newman.xml
    networks:
      - backend
